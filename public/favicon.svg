<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12"/>
      <stop offset="50%" stop-color="#04120c"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

  <!-- Radar / Audit reticle subtle elements -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#10b981" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.25"/>

  <!-- Corner tech brackets -->
  <path d="M 10 16 L 10 10 L 16 10" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 54 16 L 54 10 L 48 10" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 10 48 L 10 54 L 16 54" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 54 48 L 54 54 L 48 54" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- The stylized KODAND 'K' with Bow & Arrow aesthetic -->
  <!-- Stem -->
  <path d="M 20 16 L 27 16 L 27 48 L 20 48 Z" fill="url(#k-grad)" filter="url(#glow)"/>
  
  <!-- Upper diagonal arm with arrowhead -->
  <path d="M 27 30 L 41 16 L 48 16 L 33 32 Z" fill="url(#k-grad)" filter="url(#glow)"/>
  
  <!-- Lower diagonal arm -->
  <path d="M 30 28 L 48 48 L 41 48 L 26 33 Z" fill="url(#k-grad)" filter="url(#glow)"/>

  <!-- Gold arrow notch / reticle center dot -->
  <circle cx="32" cy="31" r="2.2" fill="url(#gold)" filter="url(#glow)"/>
  <polygon points="43,14 49,15 48,21" fill="url(#gold)"/>
</svg>

# Cloudflare Pages configuration for KODAND
# Place this file in the project root before deploying.

name = "kodand"
compatibility_date = "2024-09-01"

# Enable Node.js compatibility mode for API routes
# Note: node:dns and node:tls are NOT available on Cloudflare Workers.
# See DEPLOY.md → "API Route Notes" for workarounds.
compatibility_flags = ["nodejs_compat"]

# Output directory from @cloudflare/next-on-pages
pages_build_output_dir = ".vercel/output/static"

# Environment variables (set via dashboard or here)
[vars]
NODE_VERSION = "20"

# Cloudflare Pages configuration for KODAND
# Place this file in the project root before deploying.

name = "kodand"
compatibility_date = "2024-11-01"

# Enable Node.js compatibility mode and AsyncLocalStorage for API routes
compatibility_flags = ["nodejs_compat", "nodejs_als"]

# Output directory from @cloudflare/next-on-pages
pages_build_output_dir = ".vercel/output/static"

# Environment variables (set via dashboard or here)
[vars]
NODE_VERSION = "20"

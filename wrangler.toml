# Cloudflare Pages configuration for KODAND
name = "kodand"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat", "nodejs_als" ]

[env.production]
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat", "nodejs_als" ]

[env.preview]
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat", "nodejs_als" ]

[vars]
NODE_VERSION = "20"

[env.production.vars]
NODE_VERSION = "20"
